# Render blueprint.
#
# A persistent Node process rather than serverless, which is the right shape
# for this app: one MongoDB connection pool reused across requests instead of
# a new pool per invocation, and a fixed outbound address so Atlas network
# access and MSG91's IP security can both be narrowed to it later.
#
# Secrets are deliberately not here. Everything marked sync:false is entered
# in the Render dashboard, so this file stays safe to commit.

services:
  - type: web
    name: kettle
    runtime: node
    plan: starter # Not free: the free tier sleeps after ~15 minutes and takes
      # ~50s to wake. Someone tapping a link in an SMS will not wait.
    region: singapore # Closest to the audience. Latency to an Indian handset
      # matters more here than anything else in this file.
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /learn # A page that reads the database, so a failed
      # deploy is caught rather than serving a healthy shell.
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: 22 # Matches local. Next 16 needs 20+.
      - key: NODE_ENV
        value: production

      # Sessions. Required in production — the app refuses to start without it.
      #   openssl rand -base64 32
      - key: AUTH_SECRET
        sync: false

      # MongoDB Atlas. Must name a database, e.g. .../kettle
      - key: DATABASE_URL
        sync: false

      # MSG91. The auth key verifies widget tokens server-side and never
      # reaches the browser; the two NEXT_PUBLIC_ values are public by design.
      - key: MSG91_AUTH_KEY
        sync: false
      - key: NEXT_PUBLIC_MSG91_WIDGET_ID
        sync: false
      - key: NEXT_PUBLIC_MSG91_WIDGET_TOKEN
        sync: false
      # Delivery reports. Set the callback in MSG91 to
      #   https://<this-host>/api/webhooks/msg91?token=<this value>
      - key: MSG91_WEBHOOK_SECRET
        sync: false

      # Razorpay. Until these are set, payment is unavailable —
      # /api/payments/simulate refuses to exist in production by design.
      #
      # This service runs with NODE_ENV=production, so src/lib/payments/keys.ts
      # resolves to LIVE and will refuse a test key here outright rather than
      # let payments appear to work and settle nothing. Set the LIVE trio.
      #
      # The undecorated pair below still works and is checked first, so an
      # existing deployment carrying only those keeps working. Set one pair or
      # the other, not both.
      - key: RAZORPAY_LIVE_KEY_ID
        sync: false
      - key: RAZORPAY_LIVE_KEY_SECRET
        sync: false
      # The secret typed into the webhook at
      #   https://getkettleai.com/api/webhooks/razorpay
      # in Razorpay's LIVE dashboard, subscribed to payment.captured.
      #
      # Without it the webhook answers 503 and grants nothing, which would mean
      # a real charge and no membership. /api/payments/order refuses to create
      # an order at all while this is missing, so that cannot happen — but it
      # also means the Gold button stays unavailable until this is set.
      - key: RAZORPAY_LIVE_WEBHOOK_SECRET
        sync: false

      # Walking the paid flow on the real domain before real money is on.
      #
      # A date, like 2026-10-05. While it is in the future this service runs on
      # the TEST trio instead, so Razorpay's test checkout opens on
      # getkettleai.com and the test webhook already registered against that
      # URL delivers to it. Set RAZORPAY_TEST_KEY_ID, RAZORPAY_TEST_KEY_SECRET
      # and RAZORPAY_TEST_WEBHOOK_SECRET alongside it.
      #
      # It is a date rather than a flag because the failure it invites is
      # forgetting. A site left on test keys takes no money and looks like it
      # is working, which is the quietest way to lose every sale. Past the date
      # it returns to the live keys on its own and says so in the log.
      - key: RAZORPAY_TEST_MODE_UNTIL
        sync: false
      - key: RAZORPAY_TEST_KEY_ID
        sync: false
      - key: RAZORPAY_TEST_KEY_SECRET
        sync: false
      - key: RAZORPAY_TEST_WEBHOOK_SECRET
        sync: false

      # The single-set form. Leave unset if the LIVE trio above is used.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # The reviewer sign-in, for Razorpay website approval only. A fixed code,
      # so it is never an admin and REVIEW_UNTIL expires it on its own. Remove
      # all three once the website is approved. See src/lib/auth/review.ts.
      - key: REVIEW_PHONE
        sync: false
      - key: REVIEW_CODE
        sync: false
      - key: REVIEW_UNTIL
        sync: false

      # Who may edit the catalogue at /admin. Comma separated phone numbers,
      # any readable Indian format. Unset means nobody and /admin 404s for
      # everyone, which is correct anywhere but Rishav own service.
      - key: ADMIN_PHONES
        sync: false

      # Canonical origin. Read by robots.txt, the sitemap, every canonical
      # link and every Open Graph tag.
      #
      # NEXT_PUBLIC_ variables are inlined at build time, not read at runtime,
      # so changing this needs a rebuild rather than a restart. On Render that
      # means Manual Deploy, and "Clear build cache & deploy" if the old value
      # still shows up in page source afterwards.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
